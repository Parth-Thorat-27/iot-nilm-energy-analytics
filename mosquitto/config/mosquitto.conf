# Mosquitto 2.x broker config
listener 1883 0.0.0.0

# Anonymous access is fine on a trusted home LAN. To lock it down:
#   docker exec -it iota-mosquitto mosquitto_passwd -c /mosquitto/config/passwd <user>
#   then set allow_anonymous false and uncomment password_file.
allow_anonymous true
# password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
