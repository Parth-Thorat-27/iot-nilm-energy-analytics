; PlatformIO project for the IoTA ESP32 energy sensor.
; Open the `firmware` folder in VS Code (PlatformIO sidebar -> Build / Upload / Monitor).

[env:esp32dev]
platform = espressif32
board = esp32dev          ; ESP32 DevKit V1. For a NodeMCU-32S board use: nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    madhephaestus/ESP32Servo@^3.0.5
